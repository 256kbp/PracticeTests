<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fun Quiz - iWin Study Centre</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --primary-dark: #092c5b;
      --accent-yellow: #fde047;
      --accent-yellow-dark: #eab308;
      --bg-gradient: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #eab308 100%);
      --card-bg: #ffffff;
      --text-main: #12315b;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --error: #dc2626;
      --error-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Segoe UI', sans-serif; }

    html { overflow-y: scroll; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp 8s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Header */
    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      z-index: 10;
    }
    .logo { font-size: 24px; font-weight: 900; color: var(--primary-dark); text-decoration: none; letter-spacing: -1.2px; white-space: nowrap; }
    .logo span { color: #ff9b35; }
    .logo i { font-style: normal; color: #ffb72f; font-size: 18px; vertical-align: top; margin-left: 2px; }

    .back-link { text-decoration: none; color: var(--primary-dark); font-size: 12px; font-weight: 800; background: #f0f4f8; padding: 7px 14px; border-radius: 999px; transition: background 0.2s; white-space: nowrap; }
    .back-link:hover { background: #e2e8f0; color: #ff762f; }

    .quiz-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 0 5px rgba(255, 255, 255, 0.4);
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Dynamic Shake Animation for high streaks */
    .card-shake {
      animation: gentleShake 0.5s ease-in-out;
    }
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px) rotate(-0.5deg); }
      80% { transform: translateX(4px) rotate(0.5deg); }
    }

    /* Perfect 10 Gold Glow Effect */
    .gold-glow-card {
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.8), 0 0 0 6px #eab308 !important;
      animation: pulseGoldGlow 2s infinite alternate ease-in-out;
    }
    @keyframes pulseGoldGlow {
      0% { box-shadow: 0 0 25px rgba(250, 204, 21, 0.6), 0 0 0 5px #eab308; }
      100% { box-shadow: 0 0 45px rgba(234, 179, 8, 1), 0 0 0 8px #fde047; }
    }

    .quiz-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .progress-pill {
      background: #fef08a;
      color: #854d0e;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #fde047;
    }
    .score-pill {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .progress-bar-container {
      width: 100%;
      height: 7px;
      background: #f1f5f9;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #eab308);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 4px;
    }

    .question-box {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
      background: #fefce8;
      border-color: #facc15;
      transform: translateY(-2px);
    }
    .option-btn.selected {
      background: #fef9c3;
      border-color: #eab308;
      color: #713f12;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
    }
    .option-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #15803d !important;
    }
    .option-btn.incorrect {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .option-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: #e2e8f0;
      border-radius: 7px;
      margin-right: 12px;
      font-weight: 800;
      font-size: 0.8rem;
      color: #475569;
      flex-shrink: 0;
    }
    .option-btn.selected .option-badge { background: #facc15; color: #713f12; }
    .option-btn.correct .option-badge { background: #22c55e; color: #fff; }
    .option-btn.incorrect .option-badge { background: #ef4444; color: #fff; }

    .feedback-container {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 0.9rem;
      line-height: 1.5;
      font-weight: 600;
    }
    .feedback-container.correct { background: var(--success-bg); color: #15803d; border: 1px solid #86efac; }
    .feedback-container.incorrect { background: var(--error-bg); color: var(--error); border: 1px solid #fca5a5; }

    .action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .btn-primary { background: var(--primary-dark); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { background: #134074; transform: translateY(-2px); }
    .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    .results-screen { text-align: center; padding: 10px 0; }
    .trophy-icon { font-size: 56px; margin-bottom: 12px; display: inline-block; }
    .trophy-bounce { animation: trophyBounce 1s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes trophyBounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.18); }
    }

    .results-title { font-size: 1.6rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 6px; text-transform: uppercase; }
    .results-subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; font-weight: 600; }
    .score-card-big { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 18px; padding: 20px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .score-number { font-size: 2.6rem; font-weight: 900; color: var(--primary-dark); line-height: 1; margin-bottom: 6px; }
    .score-percentage { font-size: 1.1rem; font-weight: 800; color: #d97706; }
    .results-buttons { display: flex; gap: 10px; }
    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 14px; flex: 1; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; padding: 14px; transition: all 0.2s ease; }
    .btn-secondary:hover { background: #e2e8f0; transform: translateY(-2px); }
    .hidden { display: none !important; }

    /* Floating feedback emoji overlay */
    .floating-feedback-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 99; }
    .floating-emoji { font-size: 80px; animation: floatZoomFadeMobile 2.2s ease-out forwards; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2)); }
    
    /* Original single spin on (0 to 360deg), hold in upright orientation, then fade off */
    .floating-emoji.spin-cat {
      animation: spinOnceAndHold 2.2s cubic-bezier(0.1, 0.85, 0.2, 1) forwards;
    }
    @keyframes spinOnceAndHold {
      0% { transform: scale(0.3) translateY(20px) rotate(0deg); opacity: 0; }
      30% { transform: scale(1.2) translateY(-5px) rotate(360deg); opacity: 1; }
      75% { transform: scale(1) translateY(-20px) rotate(360deg); opacity: 1; }
      100% { transform: scale(1.05) translateY(-50px) rotate(360deg); opacity: 0; }
    }

    @keyframes floatZoomFadeMobile {
      0% { transform: scale(0.3) translateY(20px); opacity: 0; }
      20% { transform: scale(1.1) translateY(-5px); opacity: 1; }
      75% { transform: scale(1) translateY(-20px); opacity: 1; }
      100% { transform: scale(1.05) translateY(-50px); opacity: 0; }
    }

    /* Streak banner notification */
    .streak-banner {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      margin-top: 10px;
      animation: bounceInAndFadeUp 2.2s ease-out forwards;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .streak-banner.godlike {
      background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b);
      font-size: 0.95rem;
      padding: 8px 18px;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
    }

    @keyframes bounceInAndFadeUp {
      0% { transform: scale(0) translateY(20px); opacity: 0; }
      20% { transform: scale(1.15) translateY(-5px); opacity: 1; }
      75% { transform: scale(1) translateY(-20px); opacity: 1; }
      100% { transform: scale(1) translateY(-50px); opacity: 0; }
    }

    /* Additional Floating High-Streak Emojis */
    .floating-sub-emoji {
      position: absolute;
      font-size: 32px;
      animation: floatSubEmoji 2s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatSubEmoji {
      0% { transform: scale(0) translateY(10px) rotate(0deg); opacity: 0; }
      30% { transform: scale(1.3) translateY(-20px) rotate(15deg); opacity: 1; }
      100% { transform: scale(1) translateY(-90px) rotate(-15deg); opacity: 0; }
    }

    /* Countdown Overlay */
    .start-animation-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 44, 91, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 1;
      transition: opacity 0.4s ease;
      overflow: hidden;
      padding: 10px;
      text-align: center;
    }
    .start-animation-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: clamp(3.2rem, 14vw, 5rem);
      font-weight: 900;
      color: #fde047;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 6px 20px rgba(0,0,0,0.5);
      animation: popZoomFadeStepMobile 1s ease-in-out forwards;
      white-space: nowrap;
    }
    @keyframes popZoomFadeStepMobile {
      0% { transform: scale(0.4) rotate(-3deg); opacity: 0; }
      35% { transform: scale(1.15) rotate(2deg); opacity: 1; }
      75% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bubble" style="width: 70px; height: 70px; left: 10%; animation-duration: 7s;"></div>
  <div class="bubble" style="width: 100px; height: 100px; left: 75%; animation-duration: 9s; animation-delay: 2s;"></div>

  <header>
    <a class="logo" href="index.html" aria-label="iWin Study home">
        iWin <span>Study</span><span class="logo-star" aria-hidden="true">&#10022;</span>
    </a>
    <a href="#" id="backSubLink" class="back-link">&larr; Back to Subject</a>
  </header>

  <div class="quiz-container" id="quizCardContainer">
    <div id="quizGameView">
      <div class="quiz-header-info">
        <span id="questionCountBadge" class="progress-pill">Question 1 of 10</span>
        <span id="runningScore" class="score-pill">Score: 0 / 10</span>
      </div>

      <div class="progress-bar-container">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>

      <div id="questionText" class="question-text question-box">Loading Fun Quiz...</div>
      <div id="optionsContainer" class="options-grid"></div>
      <div id="feedbackBox" class="feedback-container hidden"></div>

      <button id="actionBtn" class="action-btn btn-primary" disabled>Select an Answer</button>
    </div>

    <div id="quizResultsView" class="results-screen hidden">
      <div id="trophyEmoji" class="trophy-icon">🏆</div>
      <h2 id="resultTitle" class="results-title">Fantastic Job!</h2>
      <p id="resultSubtitle" class="results-subtitle">You've successfully completed the fun challenge.</p>

      <div class="score-card-big" id="scoreCardBig">
        <div class="score-number"><span id="finalScore">0</span> / <span id="finalMaxScore">10</span></div>
        <div class="score-percentage"><span id="finalPercentage">0</span>% Accuracy</div>
      </div>

      <div class="results-buttons">
        <button onclick="restartQuiz()" class="action-btn btn-primary" style="flex: 1;">Try Again 🔄</button>
        <a id="backToSubjectBtn" href="#" class="btn-secondary">Subject Hub 🏠</a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'hindi';
    
    document.getElementById('backSubLink').href = `subject.html?subject=${subject}`;
    document.getElementById('backToSubjectBtn').href = `subject.html?subject=${subject}`;

    const TARGET_MARKS = 10;
    let testQuestions = [];
    let currentIndex = 0;
    let earnedMarks = 0;
    let totalPossibleMarks = 0;
    let selectedOptionValue = null;
    let isSubmitted = false;
    let isInitialized = false;
    let consecutiveCorrectStreak = 0;

    window.addEventListener('DOMContentLoaded', initFunQuiz);

    async function fetchQuestionsForQuiz() {
      try {
        let allQuestions = [];
        try {
          const manifestRes = await fetch(`data/${subject}/manifest.json`);
          if (manifestRes.ok) {
            const manifest = await manifestRes.json();
            for (const ch of manifest.chapters) {
              try {
                const chRes = await fetch(`data/${subject}/chapter-${ch}.json`);
                if (chRes.ok) {
                  const chData = await chRes.json();
                  allQuestions = allQuestions.concat(chData);
                }
              } catch (err) {
                console.warn(`Could not load chapter ${ch}`, err);
              }
            }
          } else {
            throw new Error('No manifest');
          }
        } catch (e) {
          const response = await fetch(`data/${subject}/questions.json`);
          if (response.ok) {
            allQuestions = await response.json();
          }
        }
        return allQuestions.filter(q => q.type === 'MCQ' && q.difficulty === 'Easy');
      } catch (error) {
        console.error('Error fetching questions:', error);
        return [];
      }
    }

    // Robust Fisher-Yates Shuffle Helper
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function initFunQuiz() {
      const mcqList = await fetchQuestionsForQuiz();
      if (mcqList.length === 0) {
        document.getElementById('questionText').textContent = 'No easy MCQ questions found for this subject.';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.textContent = 'Go Back';
        actionBtn.disabled = false;
        actionBtn.onclick = () => window.location.href = `subject.html?subject=${subject}`;
        return;
      }

      // 1. Robustly shuffle the entire available question pool
      const shuffled = shuffleArray([...mcqList]);
      testQuestions = [];
      let currentMarksSum = 0;

      for (const q of shuffled) {
        if (currentMarksSum + q.marks <= TARGET_MARKS) {
          // Clone the question and robustly shuffle its options so answers aren't always A or B
          const qCopy = { ...q };
          if (qCopy.options && Array.isArray(qCopy.options)) {
            qCopy.options = shuffleArray([...qCopy.options]);
          }
          testQuestions.push(qCopy);
          currentMarksSum += q.marks;
        }
        if (currentMarksSum === TARGET_MARKS) break;
      }

      if (testQuestions.length === 0 && shuffled.length > 0) {
        const qCopy = { ...shuffled[0] };
        if (qCopy.options && Array.isArray(qCopy.options)) {
          qCopy.options = shuffleArray([...qCopy.options]);
        }
        testQuestions.push(qCopy);
        currentMarksSum = shuffled[0].marks;
      }

      // 2. Shuffle the final selected question order so tests feel completely fresh
      shuffleArray(testQuestions);

      totalPossibleMarks = currentMarksSum;
      currentIndex = 0;
      earnedMarks = 0;
      consecutiveCorrectStreak = 0;

      const card = document.getElementById('quizCardContainer');
      card.classList.remove('gold-glow-card');

      document.getElementById('quizGameView').classList.remove('hidden');
      document.getElementById('quizResultsView').classList.add('hidden');

      renderCurrentQuestion();

      if (!isInitialized) {
        isInitialized = true;
        playStartAnimation();
      }
    }

    function playStartAnimation() {
      const quizContainer = document.getElementById('quizCardContainer');
      const overlay = document.createElement('div');
      overlay.className = 'start-animation-overlay';

      const textEl = document.createElement('div');
      textEl.className = 'start-animation-text';
      textEl.textContent = 'READY';
      overlay.appendChild(textEl);
      quizContainer.appendChild(overlay);

      const sequence = ['READY', '3', '2', '1', 'GO!'];
      let step = 0;

      const interval = setInterval(() => {
        step++;
        if (step < sequence.length) {
          textEl.style.animation = 'none';
          textEl.offsetHeight;
          textEl.style.animation = 'popZoomFadeStepMobile 1s ease-in-out forwards';
          textEl.textContent = sequence[step];
        } else {
          clearInterval(interval);
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.remove();
          }, 400);
        }
      }, 1000);
    }

    function renderCurrentQuestion() {
      isSubmitted = false;
      selectedOptionValue = null;

      const q = testQuestions[currentIndex];
      const totalQ = testQuestions.length;

      document.getElementById('questionCountBadge').textContent = `Question ${currentIndex + 1} of ${totalQ}`;
      document.getElementById('runningScore').textContent = `Score: ${earnedMarks} / ${totalPossibleMarks}`;
      
      const progressPercent = (currentIndex / totalQ) * 100;
      document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

      document.getElementById('questionText').textContent = q.question;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      if (q.options) {
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = `<span class="option-badge">${letters[idx] || (idx + 1)}</span><span>${opt}</span>`;
          btn.onclick = () => selectOption(opt, btn);
          optionsContainer.appendChild(btn);
        });
      }

      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.className = 'feedback-container hidden';
      feedbackBox.innerHTML = '';

      const actionBtn = document.getElementById('actionBtn');
      actionBtn.textContent = 'Submit Answer';
      actionBtn.disabled = true;
      actionBtn.onclick = handleActionClick;
    }

    function selectOption(optValue, btnElement) {
      if (isSubmitted) return;

      selectedOptionValue = optValue;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');

      const actionBtn = document.getElementById('actionBtn');
      actionBtn.disabled = false;
    }

    function handleActionClick() {
      if (!isSubmitted) {
        isSubmitted = true;
        const q = testQuestions[currentIndex];
        const feedbackBox = document.getElementById('feedbackBox');
        feedbackBox.classList.remove('hidden');

        const isCorrect = (selectedOptionValue === q.answer);

        if (isCorrect) {
          consecutiveCorrectStreak++;
          earnedMarks += q.marks;
          feedbackBox.className = 'feedback-container correct';
          feedbackBox.innerHTML = `<strong>Correct! 🎉 (+${q.marks} marks)</strong><br>${q.explanation || 'Great job answering correctly!'}`;
        } else {
          consecutiveCorrectStreak = 0;
          feedbackBox.className = 'feedback-container incorrect';
          feedbackBox.innerHTML = `<strong>Incorrect! ❌ (0/${q.marks} marks)</strong><br><strong>Correct Answer:</strong> ${q.answer}<br>${q.explanation || ''}`;
        }

        showStreakFeedback(isCorrect, consecutiveCorrectStreak);

        const optionButtons = document.querySelectorAll('.option-btn');
        optionButtons.forEach(btn => {
          const btnText = btn.querySelector('span:nth-child(2)').textContent;
          btn.disabled = true;
          if (btnText === q.answer) {
            btn.classList.add('correct');
          } else if (btnText === selectedOptionValue && !isCorrect) {
            btn.classList.add('incorrect');
          }
        });

        document.getElementById('runningScore').textContent = `Score: ${earnedMarks} / ${totalPossibleMarks}`;

        const actionBtn = document.getElementById('actionBtn');
        if (currentIndex < testQuestions.length - 1) {
          actionBtn.textContent = 'Next Question ➔';
        } else {
          actionBtn.textContent = 'View Final Results 🏆';
        }
        actionBtn.disabled = false;

      } else {
        currentIndex++;
        if (currentIndex < testQuestions.length) {
          renderCurrentQuestion();
        } else {
          showResults();
        }
      }
    }

    /* Addition 1: Continually Escalating Feedback Animation for Streaks 3+ */
    function showStreakFeedback(isCorrect, streak) {
      const quizContainer = document.getElementById('quizCardContainer');
      const overlay = document.createElement('div');
      overlay.className = 'floating-feedback-overlay';
      
      const emojiSpan = document.createElement('div');
      emojiSpan.className = 'floating-emoji';

      if (!isCorrect) {
        emojiSpan.textContent = '😿';
        overlay.appendChild(emojiSpan);
      } else {
        if (streak === 1) {
          emojiSpan.textContent = '😸';
          overlay.appendChild(emojiSpan);
        } else if (streak === 2) {
          emojiSpan.textContent = '😺';
          emojiSpan.classList.add('spin-cat');
          overlay.appendChild(emojiSpan);

          const badge = document.createElement('div');
          badge.className = 'streak-banner';
          badge.textContent = '🔥 2 In A Row!';
          overlay.appendChild(badge);
        } else if (streak === 3) {
          /* Original streak 3 behavior preserved */
          emojiSpan.textContent = '😻';
          emojiSpan.classList.add('spin-cat');
          overlay.appendChild(emojiSpan);

          const badge = document.createElement('div');
          badge.className = 'streak-banner';
          badge.textContent = `🚀 3 Streak Mega Win! 🌟`;
          overlay.appendChild(badge);

          triggerConfetti(45);
        } else {
          /* Escalated Streak 4 and beyond: Keep original cat & banner + Layer on intense effects */
          emojiSpan.textContent = '😻';
          emojiSpan.classList.add('spin-cat');
          overlay.appendChild(emojiSpan);

          const badge = document.createElement('div');
          badge.className = 'streak-banner godlike';
          
          if (streak === 4 || streak === 5) {
            badge.textContent = `⚡ ${streak} STREAK UNSTOPPABLE! ⚡`;
          } else if (streak === 6 || streak === 7) {
            badge.textContent = `🔥 ${streak} STREAK ON FIRE! 🔥`;
          } else {
            badge.textContent = `👑 ${streak} STREAK GODLIKE MASTER! 👑`;
          }
          overlay.appendChild(badge);

          /* Card Shake Effect */
          quizContainer.classList.remove('card-shake');
          void quizContainer.offsetWidth; // trigger reflow
          quizContainer.classList.add('card-shake');

          /* Dynamic Confetti scaling up with streak count */
          const baseCount = 45 + (streak - 3) * 15;
          triggerConfetti(baseCount);

          /* Extra Floating Sub-Emojis for higher visual energy */
          const subEmojis = ['🔥', '⚡', '✨', '🌟', '💥', '🚀', '👑'];
          const numSubEmojis = Math.min(streak - 2, 6);
          for (let i = 0; i < numSubEmojis; i++) {
            const sub = document.createElement('div');
            sub.className = 'floating-sub-emoji';
            sub.textContent = subEmojis[Math.floor(Math.random() * subEmojis.length)];
            sub.style.left = `${15 + Math.random() * 70}%`;
            sub.style.bottom = `${20 + Math.random() * 30}%`;
            sub.style.animationDelay = `${i * 0.1}s`;
            overlay.appendChild(sub);
          }
        }
      }

      quizContainer.appendChild(overlay);

      setTimeout(() => {
        overlay.remove();
      }, 2200);
    }

    function triggerConfetti(count = 45, customContainer = null) {
      const container = customContainer || document.getElementById('quizCardContainer');
      const colors = ['#fde047', '#f43f5e', '#3b82f6', '#10b981', '#a855f7', '#ff9b35', '#eab308'];
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = `${Math.floor(Math.random() * 8 + 6)}px`;
        particle.style.height = `${Math.floor(Math.random() * 8 + 6)}px`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        particle.style.top = '50%';
        particle.style.left = '50%';
        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '100';
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 180 + 60;
        const destX = Math.cos(angle) * velocity;
        const destY = Math.sin(angle) * velocity - 70;
        
        particle.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.35, 1), opacity 2s ease-out';
        particle.style.transform = `translate(0, 0) scale(1) rotate(0deg)`;
        container.appendChild(particle);
        
        requestAnimationFrame(() => {
          particle.style.transform = `translate(${destX}px, ${destY}px) scale(${Math.random() * 0.9 + 0.4}) rotate(${Math.random() * 720 - 360}deg)`;
          particle.style.opacity = '0';
        });
        
        setTimeout(() => particle.remove(), 2100);
      }
    }

    /* Addition 2: End-of-Test Celebrations for Score > 7 and Perfect 10/10 */
    function showResults() {
      document.getElementById('quizGameView').classList.add('hidden');
      document.getElementById('quizResultsView').classList.remove('hidden');

      document.getElementById('finalScore').textContent = earnedMarks;
      document.getElementById('finalMaxScore').textContent = totalPossibleMarks;

      const percentage = totalPossibleMarks > 0 ? Math.round((earnedMarks / totalPossibleMarks) * 100) : 0;
      document.getElementById('finalPercentage').textContent = percentage;

      const titleEl = document.getElementById('resultTitle');
      const subtitleEl = document.getElementById('resultSubtitle');
      const trophyEl = document.getElementById('trophyEmoji');
      const card = document.getElementById('quizCardContainer');

      trophyEl.classList.remove('trophy-bounce');

      if (earnedMarks === 10) {
        /* Perfect 10 Celebration */
        titleEl.textContent = 'PERFECT 10 / 10 MASTER! 👑';
        subtitleEl.textContent = 'Unbelievable performance! You got every single question right!';
        trophyEl.textContent = '🏆';
        trophyEl.classList.add('trophy-bounce');
        card.classList.add('gold-glow-card');

        /* Continuous multi-wave confetti blast */
        triggerConfetti(80);
        setTimeout(() => triggerConfetti(60), 400);
        setTimeout(() => triggerConfetti(50), 900);

      } else if (earnedMarks > 7) {
        /* High Score Celebration (> 7) */
        titleEl.textContent = 'Outstanding Win! 🌟';
        subtitleEl.textContent = 'You have mastered these concepts brilliantly!';
        trophyEl.textContent = '🏆';
        trophyEl.classList.add('trophy-bounce');

        /* Celebratory Confetti Burst */
        triggerConfetti(60);
        setTimeout(() => triggerConfetti(40), 500);

      } else if (percentage >= 50) {
        titleEl.textContent = 'Good Job! 👍';
        subtitleEl.textContent = 'Solid performance! Keep practicing to get even better.';
        trophyEl.textContent = '🥇';
      } else {
        titleEl.textContent = 'Nice Effort! 💪';
        subtitleEl.textContent = 'Practice makes perfect. Try again to boost your score!';
        trophyEl.textContent = '🎯';
      }
    }

    function restartQuiz() {
      playStartAnimation();
      initFunQuiz();
    }
  </script>
